name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job in this workflow needs to write.
permissions:
  contents: read

env:
  # Placeholder required by `prisma generate` (postinstall) once apps/api exists.
  # No job in this workflow connects to a real database.
  DATABASE_URL: postgresql://ci_runner@localhost/ci_placeholder

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      # Run each workspace's coverage as a SEPARATE sequential step with a bounded heap: the
      # `file:` library is reloaded into every worker, so the two apps must never run at once.
      - name: API unit coverage
        run: pnpm --filter @nest-notification-example/api test:cov
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Web unit coverage
        run: pnpm --filter web test:cov
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-unit-api
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-unit-web
          path: apps/web/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e-api:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      # Scope to the API workspace so the web Vitest suite does not also run here. The e2e suite
      # boots in-process against an in-memory OTP store + a mocked transport — no live stack.
      - name: API e2e
        run: pnpm --filter @nest-notification-example/api test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build-web:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter web build

  e2e-web:
    needs: [e2e-api, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Live journeys: the Playwright config brings up the dedicated test stack
      # (docker-compose.test.yml — Postgres/Redis/Mailpit), migrates + seeds the test database,
      # then starts the API + web; `E2E_TEARDOWN=1` tears the stack down after this one-shot run.
      - name: Web e2e (live journeys against the test stack)
        run: pnpm --filter web test:e2e
        env:
          E2E_TEARDOWN: '1'
          # The runner's e2e ports are free, so this never triggers; set so that if a port were
          # ever held by a non-healthy process the prep frees it instead of aborting the run.
          E2E_KILL_STALE: '1'

  export-usage-check:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          # Shallow single-commit fetch of the pinned SHA — GitHub allows fetching a
          # reachable commit by SHA, so this avoids cloning the library's full history.
          git init -q ../nest-notification
          git -C ../nest-notification remote add origin https://github.com/bymaxone/nest-notification.git
          git -C ../nest-notification fetch -q --depth 1 origin 3e615c9b5077c4c8d66e3c856678ec2c882d8965 # pinned SHA
          git -C ../nest-notification checkout -q FETCH_HEAD
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - name: Audit library export usage
        run: pnpm audit:exports
      - name: Audit error-code localization
        run: pnpm audit:error-codes

  dependency-review:
    # Dependency review needs the Dependency graph + GitHub Advanced Security, which are
    # unavailable on a private repository; gate it to public so it runs and gates pull
    # requests once the repo is published.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  coverage-report:
    needs: [unit, e2e-api, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download API coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-unit-api
          path: coverage/api
        continue-on-error: true
      - name: Download web coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-unit-web
          path: coverage/web
        continue-on-error: true
      - name: Fail if any metric is below 100%
        run: |
          fail=0
          for app in api web; do
            f="coverage/$app/coverage-summary.json"
            if [ ! -f "$f" ]; then
              echo "::error::Missing coverage summary $f (the unit job did not produce it)"
              fail=1
              continue
            fi
            for metric in statements branches functions lines; do
              pct=$(jq -r ".total.${metric}.pct" "$f")
              if [ "$pct" != "100" ]; then
                echo "::error::${app} ${metric} coverage is ${pct}% (expected 100%)"
                fail=1
              else
                echo "${app} ${metric}: 100%"
              fi
            done
          done
          [ "$fail" = "0" ]
      - name: Upload combined coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-combined
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore
