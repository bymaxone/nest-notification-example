# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic pipeline (lint, typecheck, format, unit+coverage, API e2e,
# web-build, export audit, mutation) lives in bymaxone/.github so every repo
# shares one definition. The live Playwright web smoke boots this app's test
# stack (Postgres/Redis/Mailpit via docker-compose.test.yml), so it stays here.
# Mutation runs only on a push to main / manual dispatch, never on PRs or a schedule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-ci.yml@v1
    with:
      library-repo: bymaxone/nest-notification
      has-web: true
      run-export-audit: true
      run-mutation: true
      run-e2e-web: false # live Playwright stack kept below
      e2e-api-command: pnpm --filter @nest-notification-example/api test:e2e
      # A placeholder is enough for the in-process API unit/e2e suites (they mock
      # the store/transport); the live web e2e uses the compose stack's real DB.
      database-url: postgresql://ci_runner@localhost/ci_placeholder
      mutation-source-globs: '^(apps/api/src/|apps/web/lib/|apps/web/components/)'

  # App-specific web smoke: the Playwright config brings up docker-compose.test.yml
  # (Postgres/Redis/Mailpit), migrates + seeds the DB, starts the API + web, then
  # walks the live journeys in one Chromium; E2E_TEARDOWN tears the stack down after.
  e2e-web:
    name: E2E — Web (Playwright)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci_runner@localhost/ci_placeholder
      E2E_TEARDOWN: '1'
      E2E_KILL_STALE: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          library-repo: bymaxone/nest-notification
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Web e2e (live journeys against the test stack)
        run: pnpm --filter web test:e2e

  security:
    # Dependency review needs the dependency graph (public repos, or private + GHAS).
    # Gated on visibility so it starts running automatically once this repo is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
