name: CodeQL

# Static analysis on every push to main, every PR into main, and a weekly cron
# (the schedule catches new CVE patterns in code that did not change).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the analyze job widens only to upload SARIF.
permissions:
  contents: read

jobs:
  analyze:
    # Code scanning upload requires Code Security (GitHub Advanced Security), which is
    # unavailable on a private repository; gate to public so analysis runs and uploads
    # SARIF once the repo is published.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      # Required for CodeQL to upload its findings to the Security tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          # JavaScript/TypeScript needs no compilation, so analyze the sources
          # directly without a build step.
          build-mode: none
          # security-extended adds higher-signal queries beyond the default set —
          # appropriate for an app that handles OTP codes and recipient PII.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:${{ matrix.language }}'
