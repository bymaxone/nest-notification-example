# Mutation testing — PR gate.
#
# Runs Stryker on the workspace(s) touched by the pull request, using the
# incremental cache so warm PRs finish quickly. The `detect` job's path filter
# matches only real mutated source, so a PR that touches no `apps/` source skips
# both mutation jobs cleanly. A weekly full (non-incremental) run lives in
# `mutation-nightly.yml` and catches drift the incremental cache might mask.

name: Mutation Testing (PR)

on:
  pull_request:
    paths:
      - 'apps/api/src/**'
      - 'apps/api/test/**'
      - 'apps/api/stryker.config.json'
      - 'apps/web/app/**'
      - 'apps/web/lib/**'
      - 'apps/web/components/**'
      - 'apps/web/stryker.config.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mutation.yml'

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DATABASE_URL: postgresql://ci_runner@localhost/ci_placeholder

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      api_ready: ${{ steps.cfg.outputs.api }}
      web_ready: ${{ steps.cfg.outputs.web }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          # Only real mutated source counts — not the lockfile or this workflow —
          # so the gate stays a no-op until application code lands.
          filters: |
            api:
              - 'apps/api/src/**'
              - 'apps/api/test/**'
              - 'apps/api/stryker.config.json'
            web:
              - 'apps/web/app/**'
              - 'apps/web/lib/**'
              - 'apps/web/components/**'
              - 'apps/web/stryker.config.json'
      - id: cfg
        # A workspace is mutation-ready only once its Stryker config exists. Until then
        # the mutation job skips, so source changes before mutation is wired (and before
        # the per-workspace mutation scripts exist) do not fail the gate.
        run: |
          [ -f apps/api/stryker.config.json ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          [ -f apps/web/stryker.config.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  mutation-api:
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.api_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          git clone --depth 1 https://github.com/bymaxone/nest-notification.git ../nest-notification
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @nest-notification-example/api run db:generate
        env:
          DATABASE_URL: postgresql://localhost:5432/ci_placeholder
      - name: Restore Stryker incremental cache (api)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/api/reports/stryker-incremental.json
          key: stryker-incremental-api-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-api-${{ github.ref }}-
            stryker-incremental-api-refs/heads/main-
      - name: Run mutation testing (api)
        run: pnpm --filter @nest-notification-example/api run mutation:incremental
      - name: Upload mutation HTML report (api)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-api
          path: apps/api/reports/mutation/
          retention-days: 30
          if-no-files-found: ignore

  mutation-web:
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.web_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the pre-publish sibling library
        run: |
          git clone --depth 1 https://github.com/bymaxone/nest-notification.git ../nest-notification
          pnpm -C ../nest-notification install --frozen-lockfile
          pnpm -C ../nest-notification build
      - run: pnpm install --frozen-lockfile
      - name: Restore Stryker incremental cache (web)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/reports/stryker-incremental.json
          key: stryker-incremental-web-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-web-${{ github.ref }}-
            stryker-incremental-web-refs/heads/main-
      - name: Run mutation testing (web)
        run: pnpm --filter web run mutation:incremental
      - name: Upload mutation HTML report (web)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-web
          path: apps/web/reports/mutation/
          retention-days: 30
          if-no-files-found: ignore
