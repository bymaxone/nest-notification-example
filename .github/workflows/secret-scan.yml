name: Secret scan

# Scans the full git history on every push and PR for committed secrets. Runs the
# gitleaks CLI directly (MIT-licensed) rather than the gitleaks Action, whose
# organization use requires a paid license key the public repo must not carry.
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # full history so the scan covers every commit on the ref

      # `$GITLEAKS_VERSION` is the workflow-level env var (a trusted constant),
      # consumed as a shell variable — never interpolated via `${{ }}` into the
      # script body.
      - name: Run gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
