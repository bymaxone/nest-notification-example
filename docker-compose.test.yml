name: nest-notification-example-test

# Ephemeral test stack — Postgres + Redis on alternate host ports (so they run alongside the
# dev stack without collision) and tmpfs storage (nothing persists between runs). Static
# test-only credentials; never reuse outside CI. Everything is bound to 127.0.0.1.
#
# Mailpit is included so the live Playwright journeys can poll a real inbox (generate OTP →
# Mailpit → verify; send email → Mailpit). It binds the STANDARD Mailpit ports (SMTP 1025,
# web/API 8025) — the same as the dev stack — so the test stack's Mailpit must not run
# concurrently with the dev stack's Mailpit. In CI only this stack runs, so there is no
# collision. Brought up by `pnpm infra:test:up`, torn down by `pnpm infra:test:down`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Static, test-only credentials — fixed (not read from the host env) so the test
      # stack is deterministic and never couples to a developer's local configuration.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_example_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      # Mount at the data dir itself: the postgres image declares a volume at
      # /var/lib/postgresql/data, which would shadow a tmpfs on the parent.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notification_example_test']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

  mailpit:
    # Digest-pinned to the same version used by the dev stack (axllent/mailpit v1.x). The
    # live e2e journeys send through SMTP :1025 and read the captured mail via the HTTP
    # API on :8025, asserting the OTP/email actually left the building.
    image: axllent/mailpit@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v1/info || exit 1']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

networks:
  ci:
    driver: bridge
