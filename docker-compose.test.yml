name: nest-notification-example-test

# Ephemeral test stack — Postgres + Redis on alternate host ports (so they run alongside the
# dev stack without collision) and tmpfs storage (nothing persists between runs). Static
# test-only credentials; never reuse outside CI. Everything is bound to 127.0.0.1.
#
# Mailpit is included so the live Playwright journeys can poll a real inbox (generate OTP →
# Mailpit → verify; send email → Mailpit). It binds ALTERNATE host ports (SMTP 51025, web/API
# 58025) that forward to Mailpit's standard container ports (1025/8025) — distinct from the dev
# stack's standard 1025/8025 — so the test stack's Mailpit can run alongside the dev stack's
# without a host-port collision. Brought up by `pnpm infra:test:up`, torn down by
# `pnpm infra:test:down`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Static, test-only credentials — fixed (not read from the host env) so the test
      # stack is deterministic and never couples to a developer's local configuration.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_example_test
      # initdb runs in a fresh SUBDIRECTORY of the tmpfs mount, never the mount point
      # itself. A tmpfs is mounted root-owned and world-writable (mode 1777), and Postgres
      # refuses a data directory with group/world permissions. A subdir that initdb creates
      # and owns at 0700 sidesteps that — the canonical fix for mounting at the data dir.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      # Ephemeral storage — nothing persists between runs. PGDATA (above) points at a subdir
      # of this mount so initdb gets a clean, correctly-owned directory rather than the
      # root-owned mount point.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notification_example_test']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

  mailpit:
    # Digest-pinned to the same version used by the dev stack (axllent/mailpit v1.x). The
    # live e2e journeys send through SMTP (host :51025) and read the captured mail via the HTTP
    # API (host :58025), asserting the OTP/email actually left the building. The container keeps
    # Mailpit's standard ports (1025/8025); only the host mappings are shifted to avoid colliding
    # with a running dev-stack Mailpit on 1025/8025.
    image: axllent/mailpit@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v1/info || exit 1']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

networks:
  ci:
    driver: bridge
