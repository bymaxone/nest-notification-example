name: nest-notification-example-test

# Ephemeral test stack — alternate host ports (runs alongside the dev stack without collision)
# and tmpfs storage (nothing persists between runs). Static test-only credentials; never reuse
# outside CI. Everything is bound to 127.0.0.1.
#
# No Mailpit — the test tier mocks the email provider; only Postgres and Redis are needed.
# Brought up by `pnpm infra:test:up`, torn down by `pnpm infra:test:down`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Static, test-only credentials — fixed (not read from the host env) so the test
      # stack is deterministic and never couples to a developer's local configuration.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_example_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      # Mount at the data dir itself: the postgres image declares a volume at
      # /var/lib/postgresql/data, which would shadow a tmpfs on the parent.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notification_example_test']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - ci

networks:
  ci:
    driver: bridge
